<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Math Game</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background-color: #f0f2f5; }
        .game-card { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; width: 300px; }
        input { padding: 10px; width: 80px; font-size: 1.2rem; margin: 10px 0; }
        button { padding: 10px 20px; font-size: 1rem; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
        #message { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
<div class="game-card">
    <h2>Math Quiz</h2>
    <div id="question" style="font-size: 1.5rem; margin-bottom: 10px;">? + ?</div>
    <input type="number" id="answer" placeholder="Ans">
    <br>
    <button onclick="checkAnswer()">Submit</button>
    <p id="message"></p>
    <p>Score: <span id="score">0</span></p>
</div>
<script>
    let num1, num2, correctAnswer;
    let score = 0;
    function generateQuestion() {
        num1 = Math.floor(Math.random() * 10) + 1;
        num2 = Math.floor(Math.random() * 10) + 1;
        correctAnswer = num1 + num2;
        document.getElementById('question').innerText = `${num1} + ${num2} = ?`;
        document.getElementById('answer').value = '';
    }
    function checkAnswer() {
        const userAnswer = parseInt(document.getElementById('answer').value);
        const message = document.getElementById('message');
        if (userAnswer === correctAnswer) {
            score++;
            message.innerText = "Correct! 🎉";
            message.style.color = "green";
        } else {
            message.innerText = `Wrong! It was ${correctAnswer}.`;
            message.style.color = "red";
        }
        document.getElementById('score').innerText = score;
        generateQuestion();
    }
    // Initialize game
    generateQuestion();
</script>
</body>
</html>
